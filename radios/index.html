<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melodic Pulse - Global Scanner</title>
    
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">

    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        /* Correção para o iPhone: Garantir que a imagem ocupe o espaço correto */
        .header img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 2px solid #ffcc00;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 20px 0;
        }

        .station-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .station-card.active {
            border-left-color: #ffcc00;
            background: #252525;
        }

        .station-info {
            display: flex;
            flex-direction: column;
        }

        .station-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #ffcc00;
        }

        .station-genre {
            font-size: 0.8em;
            color: #888;
            margin-top: 4px;
        }

        .play-btn {
            background: #ffcc00;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
        }

        .status-bar {
            position: sticky;
            bottom: 0;
            width: 100%;
            background: #111;
            padding: 15px 0;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .eq-container {
            display: flex;
            gap: 3px;
            height: 20px;
            align-items: flex-end;
            opacity: 0.3;
        }

        .eq-bar { width: 4px; background: #ffcc00; height: 3px; border-radius: 2px; }
        .playing .eq-container { opacity: 1; }
        .playing .eq-bar { animation: eqAnim 0.5s infinite ease-in-out alternate; }
        .playing .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .eq-bar:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes eqAnim { from { height: 3px; } to { height: 18px; } }

        .volume-box { width: 80%; display: flex; align-items: center; gap: 10px; }
        .volume-slider { flex-grow: 1; accent-color: #ffcc00; height: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="topo.png?v=2" alt="Melodic Pulse Banner">
    </div>

    <div class="container" id="station-list">
        <div class="station-card" onclick="playStation('https://stream.radioparadise.com/rock-192', this)">
            <div class="station-info">
                <span class="station-name">Radio Paradise Rock</span>
                <span class="station-genre">Classic & Modern Rock</span>
            </div>
            <button class="play-btn">▶</button>
        </div>

        <div class="station-card" onclick="playStation('https://ais-sa2.cdnstream1.com/2285_128.mp3', this)">
            <div class="station-info">
                <span class="station-name">Hard Rock Hell</span>
                <span class="station-genre">Heavy Metal & Hard Rock</span>
            </div>
            <button class="play-btn">▶</button>
        </div>
    </div>

    <div class="status-bar" id="player-status">
        <div class="eq-container">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>
        <div id="current-status">SINAL STANDBY</div>
        <div class="volume-box">
            <span>🔈</span>
            <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.1" value="0.8">
            <span>🔊</span>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const statusText = document.getElementById('current-status');
        const playerStatus = document.getElementById('player-status');
        const volumeSlider = document.getElementById('volume');

        function playStation(url, element) {
            const allCards = document.querySelectorAll('.station-card');
            allCards.forEach(card => card.classList.remove('active'));
            
            if (audio.src === url && !audio.paused) {
                audio.pause();
                playerStatus.classList.remove('playing');
                statusText.innerText = "SINAL INTERROMPIDO";
            } else {
                element.classList.add('active');
                audio.src = url;
                audio.play();
                playerStatus.classList.add('playing');
                statusText.innerText = "SINAL LOCALIZADO";
            }
        }

        volumeSlider.oninput = (e) => {
            audio.volume = e.target.value;
        };
    </script>
</body>
</html>
